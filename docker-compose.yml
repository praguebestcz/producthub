# Lokální PostgreSQL pro vývoj producthub.
# Spuštění:  docker compose up -d      (na pozadí)
# Zastavení: docker compose down       (data zůstanou ve volume)
# POSTGRES_PASSWORD se čte z .env (stejná hodnota jako v DATABASE_URL).
#
# Port na hostiteli je 5433 (ne výchozích 5432), aby nekolidoval s Postgresem
# aplikace vratky, pokud běží současně. Uvnitř kontejneru je to pořád 5432.

services:
  db:
    image: postgres:17-alpine
    container_name: producthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: producthub_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: producthub
    ports:
      # Po expert review: bind jen na localhost — bez "127.0.0.1:" by byla DB
      # s vývojovým heslem dostupná z celé sítě (např. veřejná Wi-Fi).
      - "127.0.0.1:5433:5432"
    volumes:
      - producthub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U producthub_app -d producthub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Lokální falešná schránka pro testování e-mailů (nic se neodešle ven).
  # SMTP na 1025 (aplikace posílá sem), web UI na http://localhost:8025.
  # ACCEPT_ANY + ALLOW_INSECURE: přijme jakékoli přihlašovací údaje bez TLS
  # (jen pro lokální vývoj — Mailpit není určený na produkci).
  mailpit:
    image: axllent/mailpit:latest
    container_name: producthub-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  producthub_pgdata:
